<!DOCTYPE html>
<html>

<head>
    <title>Employee Login: Technofirst Workflow Inc.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_login.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/Technofirst (printer logo).png') }}?v=1"
        type="image/png">
</head>

<body>

    <form class="login-card" autocomplete="off" onsubmit="loginUser(event)">

        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

        <h1>LOGIN</h1>

        <input type="text" autocomplete="new-password" id="username" placeholder="Username" required>

        <input type="password" autocomplete="new-password" id="password" placeholder="Password" required>

        <button type="submit">
            LOGIN
        </button>

        <a href="/user_register" class="register-link">
            Create Account
        </a>

    </form>

    <script src="{{ url_for('static', filename='scripts/scripts_login.js') }}"></script>

</body>
</html>
