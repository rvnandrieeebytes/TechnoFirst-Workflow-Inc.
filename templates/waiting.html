<!DOCTYPE html>
<html>

<head>
    <title>Waiting Queue: Technofirst Workflow Inc.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_waiting.css') }}?v=1">
    <link rel="icon" href="{{ url_for('static', filename='images/Technofirst (printer logo).png') }}?v=1"
        type="image/png">
</head>

<body>
    <div class="main-wrapper">
        <div class="glass-card">
            <div class="container">
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="app-logo">
            </div>

            <div class="status-header">
                <p class="status-label">CURRENT STATUS</p>
                <div id="statusIndicator" class="pulse-dot"></div>
            </div>

            <div class="queue-section">
                <p class="queue-title">YOUR QUEUE NUMBER</p>
                <h1 id="assignedID" class="queue-number">----</h1>
            </div>

            <div class="price-section">
                <p class="price-title">TOTAL PRICE</p>
                <h2 id="priceDisplay" class="price-display">₱0</h2>
            </div>

            <div id="waitMsg" class="interaction-area">

                <p id="statusText" class="loading-text">
                    Waiting in queue...
                </p>

                <!-- PRICE -->
                <div id="priceContainer" style="display:none;"></div>

                <!-- RIDER -->
                <div id="riderInfo" style="display:none;">

                    <p>
                        Rider:
                        <span id="riderName"></span>
                    </p>

                    <p>
                        Contact:
                        <span id="riderContact"></span>
                    </p>

                </div>

                <!-- ORDER AGAIN -->
                <button id="orderAgainBtn" class="btn-new" style="display:none; margin-top: 20px;" onclick="window.location.href='/'">
                    ORDER AGAIN
                </button>
            </div>
        </div>
    </div>
    <script>

    </script>
    <script src="{{ url_for('static', filename='scripts/scripts_waiting.js') }}?v=1"></script>
</body>

</html>
